<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071426">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="description" content="Wed đã tạm dừng. Hãy chờ đợi giáo viên sẽ cấp 1 wed mới">
  <title>Website đã tạm dừng</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: #f8fafc; background:
      radial-gradient(ellipse 60% 50% at 16% 16%, rgba(56, 189, 248, .15), transparent),
      radial-gradient(ellipse 60% 60% at 85% 85%, rgba(129, 140, 248, .16), transparent),
      #071426;
    }
    main { width: min(100%, 620px); padding: clamp(32px, 7vw, 64px) clamp(24px, 6vw, 48px);
      text-align: center; border-radius: 26px; background: rgba(15, 31, 55, .92);
      border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 25px 80px rgba(0, 0, 0, .28);
    }
    .icon { display: grid; place-items: center; width: 76px; height: 76px;
      margin: 0 auto 24px; border: 1px solid rgba(125, 211, 252, .35);
      border-radius: 23px; background: rgba(56, 189, 248, .12); color: #7dd3fc;
    }
    .icon svg { width: 34px; height: 34px; }
    .status { margin: 0 0 14px; font-size: 12px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: #7dd3fc; }
    h1 { margin: 0 0 18px; font-weight: 750; font-size: clamp(27px, 5vw, 40px);
      line-height: 1.25; letter-spacing: -.03em; }
    p.message { margin: 0; font-size: clamp(17px, 2.8vw, 20px); line-height: 1.8; color: #cbd5e1; }
    .line { width: 70px; height: 3px; margin: 30px auto 0; border-radius: 99px; background: #38bdf8; }
    @media (prefers-reduced-motion: no-preference) { main { animation: show .45s ease-out both; }
      @keyframes show { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } } }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="pause-title">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M10 8v8M14 8v8"></path>
      </svg>
    </div>
    <p class="status">Thông báo hệ thống</p>
    <h1 id="pause-title">Wed đã tạm dừng.</h1>
    <p class="message">Hãy chờ đợi giáo viên sẽ cấp 1 wed mới</p>
    <div class="line" aria-hidden="true"></div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
