name: Source of truth audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TRACKED FILE COUNT ==='
          git ls-files | wc -l
          echo '=== JS FILE COUNT ==='
          git ls-files '*.js' | wc -l
          echo '=== RULE FILES ==='
          git ls-files '*rules*.json' '*rules*.js' || true

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if ! node --check "$file" >/tmp/node-check.out 2>&1; then
              echo "SYNTAX_FAIL $file"
              cat /tmp/node-check.out
              failed=1
            fi
          done < <(git ls-files '*.js')
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo 'SYNTAX_OK all tracked JavaScript files'

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          files = subprocess.check_output(['git','ls-files','*.json'], text=True).splitlines()
          bad=[]
          for f in files:
              try:
                  with open(f, encoding='utf-8') as h: json.load(h)
              except Exception as e:
                  bad.append((f,str(e)))
          if bad:
              for f,e in bad: print('JSON_FAIL', f, e)
              raise SystemExit(1)
          print('JSON_OK', len(files), 'tracked JSON files')
          PY

      - name: Cross-repository evidence grep
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'AppStartupLoader.fail'
            'firebaseConfig'
            'renderStudentRoadmap'
            'StoreManager.unapplyItem'
            'MidAutumnCalendar'
            'purchase_locks'
            'question_bank'
            'refund_pending'
            'leaderboard_reward'
            'leaderboard_chest'
            'daily_login'
            'royal_ball'
            'bellum_completion_reward'
            'student_coins'
            'student_money_offset'
            'student_bonus_tickets'
            'historical_grade_tickets'
            'student_discounts'
            'student_inventory'
            'Math.random'
            'claimToken'
            'processingToken'
            'operationId'
            'localStorage'
          )
          for p in "${patterns[@]}"; do
            echo "===== PATTERN: $p ====="
            git grep -n -F "$p" -- ':!*.map' || true
          done

      - name: Detect duplicate JavaScript function declarations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, collections
          files=subprocess.check_output(['git','ls-files','*.js'], text=True).splitlines()
          for f in files:
              text=open(f,encoding='utf-8',errors='replace').read()
              names=re.findall(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', text)
              dup=[(n,c) for n,c in collections.Counter(names).items() if c>1]
              if dup:
                  print('DUP_FUNCTION_DECL', f, dup)
          PY

      - name: Git diff summary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PR DIFF VS MAIN ==='
          git diff --stat origin/main...HEAD
          git diff --check origin/main...HEAD
