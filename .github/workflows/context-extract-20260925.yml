name: context-extract-20260925
on:
  push:
    branches: [audit-integrity-20260925]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
            'js/student.js': ["submissions", "cash_requests", "refund_pending", "student_coins", "student_money_offset", "student_bonus_tickets", "question_bank", "password"],
            'js/teacher.js': ["password", "question_bank", "renderStudentRoadmap", "cash_requests", "refund_pending"],
            'js/common.js': ["firebaseConfig", "password", "role"],
            'js/firebase-config.js': ["firebaseConfig"],
            'js/store-manager.js': ["unapplyItem", "refund_pending", "student_coins", "student_inventory"],
            'js/luxury-store.js': ["unapplyItem", "refund_pending", "student_coins", "student_inventory"],
            'js/leaderboard.js': ["leaderboard_reward", "leaderboard_chest", "Math.random", "leaderboard_reward_claims"],
            'js/royal-ball.js': ["royal_ball", "Math.random", "spin_history", "student_coins", "student_inventory"],
            'js/bellum-event.js': ["bellum_completion_reward", "Thất Đại Tội", "student_event_rewards", "student_inventory"],
            'js/painting.js': ["hoihoa_season", "hoihoa_runner_up", "student_inventory", "student_coins"],
            'js/pet-interactions.js': ["buyFood", "student_coins", "unlock"],
            'js/store-collections.js': ["claimToken", "student_collection_rewards", "student_coins"],
            'js/transaction-history.js': ["undoing", "undoConversion", "leaderboard_reward"],
            'js/mid-autumn-festival.js': ["MidAutumnCalendar", "student_coins", "mid_autumn_wallets"],
            'js/roadmap-startup-fix.js': ["AppStartupLoader", ".fail"],
          }
          out=[]
          for file, pats in targets.items():
              p=Path(file)
              if not p.exists(): continue
              lines=p.read_text(encoding='utf-8').splitlines()
              out.append(f'# {file}\n')
              seen=set()
              for pat in pats:
                  matches=[i for i,l in enumerate(lines) if pat in l]
                  out.append(f'## pattern `{pat}` — {len(matches)} hits\n')
                  for i in matches[:80]:
                      lo=max(0,i-8); hi=min(len(lines),i+10)
                      key=(lo,hi)
                      if key in seen: continue
                      seen.add(key)
                      out.append(f'### lines {lo+1}-{hi}\n```js')
                      for j in range(lo,hi):
                          out.append(f'{j+1:05d}: {lines[j]}')
                      out.append('```\n')
          Path('_audit/verified-contexts.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          rm -f .github/workflows/context-extract-20260925.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _audit/verified-contexts.md .github/workflows/context-extract-20260925.yml
          git commit -m "audit: add verified source contexts [skip context]"
          git push
