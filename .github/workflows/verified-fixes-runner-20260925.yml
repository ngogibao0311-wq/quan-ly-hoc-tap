name: verified-fixes-runner-20260925

on:
  push:
    branches:
      - audit-integrity-20260925

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and run verified patch
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('.github/workflows/verified-fixes-20260925.yml').read_text(encoding='utf-8'); s=p.split(\"python - <<'PY'\\n\",1)[1].split('\\n          PY\\n',1)[0]; s='\\n'.join((line[10:] if line.startswith('          ') else line) for line in s.splitlines()); Path('/tmp/apply_verified_fixes.py').write_text(s+'\\n',encoding='utf-8')"
          python /tmp/apply_verified_fixes.py
          python -c "from pathlib import Path; [p.write_text((lambda t: t[2:] if t.startswith('\\\\\\n') else t)(p.read_text(encoding='utf-8')), encoding='utf-8') for p in [Path('functions/index.js'), Path('js/teacher-admin-functions.js')]]"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for name in ['js/teacher.js','js/common.js','teacher.html','database.rules.patched.json']:
              original = subprocess.check_output(['git','show',f'HEAD:{name}'])
              path = Path(name)
              current = path.read_bytes().replace(b'\r\n', b'\n')
              if b'\r\n' in original:
                  current = current.replace(b'\n', b'\r\n')
              path.write_bytes(current)
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool database.rules.patched.json >/dev/null
          python -m json.tool firebase.json >/dev/null
          python -m json.tool functions/package.json >/dev/null
          for f in js/*.js functions/*.js; do node --check "$f" >/dev/null; done
          git -c core.whitespace=cr-at-eol diff --check
          ! grep -q "LEGACY_QB_PATH" js/teacher.js
          ! grep -q 'const password = student.password' js/teacher.js
          ! grep -q 'currentUser.password = newPassword' js/teacher.js
          ! grep -q 'updateData.password = newPass' js/teacher.js
          ! grep -q '\${st.password}' js/teacher.js
          grep -q "user.role === 'student'" js/common.js
          grep -q "TeacherAdminFunctions.updateStudentPassword" js/teacher.js
          grep -q "firebase-functions.js" teacher.html

      - name: Install Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          node --check functions/index.js

      - name: Commit replacements and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf functions/node_modules
          rm -f .github/workflows/verified-fixes-20260925.yml
          rm -f .github/workflows/verified-fixes-runner-20260925.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: replace verified auth rules and integrity defects"
          git push
