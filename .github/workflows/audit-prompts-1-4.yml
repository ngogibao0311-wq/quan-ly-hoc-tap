name: Audit Prompts 1-4

on:
  push:
    branches:
      - fix/verified-integrity-prompts-1-4-20260925
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node tests/syntax-check.cjs
      - name: Regression tests
        run: node --test tests/*.test.cjs
