              '<script src="js/roadmap-startup-fix.js?v=1.0"></script>\n    <script src="js/teacher-admin-functions.js?v=20260925.admin-auth-v1"></script>\n\n    <script src="js/teacher.js?v=20260925.admin-auth-v1"></script>',
              'teacher admin wrapper'
          )
          write('teacher.html',html)

          # -----------------------------------------------------------------
