          t=t.replace('${st.password}', '<span title="Mật khẩu không được lưu trong RTDB">Firebase Auth</span>')

          # New students: password goes only to Firebase Auth, never users/<uid>.
          t=replace_once(t, '            username,\n            password,\n            name,', '            username,\n            name,', 'createStudent plaintext field')

          # Delete student: no secondary sign-in with stored password; Admin callable owns Auth deletion.
          t=t.replace('        const password = student.password;\n', '')
          delete_pattern=r'''\n        // 3\. Xóa Auth trước\. Nếu thất bại thì hủy toàn bộ bước xóa Database\..*?\n        // 4\. Chỉ xóa Database sau khi Auth học sinh đã bị xóa thành công\.'''
          delete_repl='''\n        // 3. Xóa Auth bằng Admin SDK phía server. Client giáo viên không cần và không được biết mật khẩu học sinh.\n        if (!window.TeacherAdminFunctions?.deleteStudentAuth) {\n            throw new Error('Chức năng quản trị Firebase Auth chưa sẵn sàng.');\n        }\n        await window.TeacherAdminFunctions.deleteStudentAuth(uid);\n        authDeleteSuccess = true;\n\n        // 4. Chỉ xóa Database sau khi server xác nhận Auth đã bị xóa thành công.'''
          t=sub_once(t,delete_pattern,delete_repl,'deleteStudent auth replacement')

          # Remove legacy helper implementations that authenticate as the student using RTDB plaintext.
          t=sub_once(
